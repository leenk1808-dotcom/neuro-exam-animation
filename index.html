<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#060A14;overflow:hidden;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;position:relative;color:#EAF0FF;overflow:hidden;transform-origin:center center;flex:none;
  background:radial-gradient(1200px 700px at 62% 42%,#1B2C55 0%,#0E1730 48%,#070C1A 100%)}
#stage::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(140,170,255,.10) 1px,transparent 1.4px);background-size:34px 34px;mask-image:radial-gradient(900px 600px at 60% 45%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(900px 600px at 60% 45%,#000 30%,transparent 80%)}
#gl{position:absolute;left:0;top:0;width:1600px;height:900px;z-index:1;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;z-index:3;pointer-events:none}
#scene{position:absolute;inset:0;z-index:4;pointer-events:none}
#scene .pe{pointer-events:auto}
.instant *{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}

/* common */
.hdr{position:absolute;left:58px;top:36px}
.kicker{font-size:18px;letter-spacing:.16em;color:#8FA6D8;font-weight:800}
.ttl{font-size:40px;font-weight:800;margin-top:4px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.4)}
.fade{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.fade.on{opacity:1;transform:none}
.en{font-family:'Segoe UI','Pretendard','Malgun Gothic',sans-serif}
.glass{position:absolute;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.glass h3{margin:0 0 12px;font-size:26px;font-weight:800}
.glass .row{font-size:22px;line-height:1.55;font-weight:600;color:#DCE5FA}
.glass .row b{color:#fff}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;font-size:18px;font-weight:800;background:rgba(255,255,255,.12);margin:3px 4px 3px 0}
.hl-y{color:#FFE45C}.hl-b{color:#7FB2FF}.hl-g{color:#5EE0A8}.hl-p{color:#FF8CC6}.hl-o{color:#FFAE5C}.hl-r{color:#FF6B6B}
.pt{position:absolute;right:56px;top:40px;background:#FFE45C;color:#1A1A1A;font-weight:900;font-size:17px;padding:6px 14px;border-radius:10px;letter-spacing:.04em}

/* 3D labels */
.lb3{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s ease;will-change:transform}
.lb3.on{opacity:1}.lb3.on.hid{opacity:0}
.lb3 .dt{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 18px var(--c)}
.lb3 .ln{position:absolute;left:0;top:-1px;height:2px;background:linear-gradient(90deg,var(--c),rgba(255,255,255,.7));transform-origin:0 50%}
.lb3 .tx{position:absolute;left:0;top:0;white-space:nowrap;background:rgba(9,14,30,.86);border:2px solid var(--c);color:#fff;font-size:21px;font-weight:800;padding:6px 15px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.lb3 .tx small{font-size:16px;color:#C7D3F2;font-weight:700;margin-left:6px}
.lb3.big .tx{font-size:25px;padding:8px 18px}

/* caption */
#cap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:1380px;width:max-content;background:rgba(8,12,26,.88);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:28px;font-weight:600;line-height:1.45;padding:13px 32px 15px;border-radius:18px;opacity:0;transition:opacity .3s;z-index:40;text-align:center;word-break:keep-all;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#cap.on{opacity:1}
#cap .n{display:block;font-size:13px;letter-spacing:.2em;color:#8FA6D8;margin-bottom:3px;font-weight:800}

/* quiz */
.quiz{position:absolute;left:50%;top:120px;translate:-50% 0;width:1120px;padding:30px 38px 28px}
.quiz .qh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.quiz .qh .tag{background:#FF6B6B;color:#fff;font-weight:900;font-size:19px;padding:5px 14px;border-radius:10px}
.quiz .qh .tag.k{background:#FFE45C;color:#1a1a1a}
.quiz .q{font-size:30px;font-weight:800;line-height:1.45;word-break:keep-all;padding-right:90px}
.quiz.compact{top:78px;padding:22px 34px 20px}.quiz.compact .q{font-size:26px}.quiz.compact .box{font-size:20px;line-height:1.6;padding:8px 20px}.quiz.compact .op{font-size:21px;padding:7px 16px}.quiz.compact .ops{gap:7px}
.quiz .box{margin:14px 0 4px;border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:12px 22px;font-size:23px;line-height:1.7;color:#DCE5FA}
.quiz .ops{margin-top:14px;display:grid;gap:9px}
.quiz .op{font-size:25px;font-weight:700;padding:10px 18px;border-radius:12px;background:rgba(255,255,255,.06);border:2px solid transparent;transition:.4s}
.quiz .op.ok{background:rgba(46,204,138,.22);border-color:#2ECC8A;color:#fff}
.quiz .op.no{opacity:.38}
.quiz .cd{position:absolute;right:30px;top:24px;width:66px;height:66px}
.quiz .cd circle{fill:none;stroke-width:7}
.quiz .cd .bg{stroke:rgba(255,255,255,.15)}
.quiz .cd .fg{stroke:#FFE45C;stroke-dasharray:189;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:33px 33px}
.quiz.run .cd .fg{animation:cd var(--d,7s) linear forwards}
@keyframes cd{to{stroke-dashoffset:189}}
.paused .quiz.run .cd .fg{animation-play-state:paused}

/* menu */
#menu{position:absolute;inset:0;z-index:80;padding:30px 60px;display:none;background:radial-gradient(1200px 700px at 70% 30%,#1B2C55 0%,#0B1328 55%,#060A16 100%)}
#menu.on{display:block}
#menu h1{margin:0;font-size:40px;font-weight:800;color:#fff}
#menu .sub{font-size:17px;color:#9FB2DA;margin:6px 0 17px}
#menu .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#menu .card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.08);border-radius:16px;padding:11px 15px 10px;cursor:pointer;transition:.2s;color:#EAF0FF}
#menu .card:hover{border-color:#7FB2FF;transform:translateY(-3px)}
#menu .card .k{font-size:13px;font-weight:800;letter-spacing:.1em;color:#8FA6D8}
#menu .card .t{font-size:18px;font-weight:800;margin:5px 0 4px;line-height:1.3}
#menu .card .d{font-size:14px;color:#A9B8D8}
#menu .card.all{background:linear-gradient(135deg,#3B6FD8,#6A4BD8);border-color:transparent}
#menu .card.all .k,#menu .card.all .d{color:#E3E9FF}
#menu .card.soon{opacity:.38;cursor:default}
#menu .card.soon:hover{transform:none;border-color:rgba(255,255,255,.08)}
#menu .foot{position:absolute;left:60px;right:60px;bottom:12px;font-size:13px;color:#8394B8;line-height:1.6}

#endov{position:absolute;right:40px;top:36px;z-index:70;display:none;gap:10px}
#endov.on{display:flex}
#endov button{font:inherit;font-size:20px;font-weight:800;padding:12px 22px;border-radius:14px;border:none;cursor:pointer;background:#3B6FD8;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#endov button.ghost{background:rgba(255,255,255,.12);color:#fff}

/* ---- 플레이어 컨트롤 바 ---- */
#ctrl{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:26px 18px 10px;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0));opacity:0;transition:opacity .3s;pointer-events:none;font-family:'Pretendard','Malgun Gothic',sans-serif}
body.mouse.playing #ctrl, body.paused.playing #ctrl{opacity:1;pointer-events:auto}
#bar{position:relative;height:18px;cursor:pointer;margin:0 4px 6px}
#bar .trk{position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);transition:height .15s,top .15s}
#bar:hover .trk,#bar.drag .trk{height:6px;top:6px}
#bar .prog{position:absolute;left:0;top:7px;height:4px;border-radius:2px;background:#FF2D2D;transition:height .15s,top .15s}
#bar:hover .prog,#bar.drag .prog{height:6px;top:6px}
#bar .hov{position:absolute;left:0;top:7px;height:4px;background:rgba(255,255,255,.35);border-radius:2px;display:none}
#bar:hover .hov{display:block;height:6px;top:6px}
#bar .knob{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#FF2D2D;transform:scale(0);transition:transform .15s}
#bar:hover .knob,#bar.drag .knob{transform:scale(1)}
#bar .tk{position:absolute;top:7px;width:3px;height:4px;background:rgba(0,0,0,.55)}
#bar .tipx{position:absolute;bottom:26px;transform:translateX(-50%);background:rgba(10,14,28,.95);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.45;width:300px;display:none;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#bar .tipx b{display:block;font-size:13px;color:#FFD25E;margin-bottom:2px}
#bar:hover .tipx,#bar.drag .tipx{display:block}
#ctrl .rw{display:flex;align-items:center;gap:4px}
#ctrl button{background:none;border:none;color:#fff;cursor:pointer;width:44px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:inherit}
#ctrl button:hover{background:rgba(255,255,255,.12)}
#ctrl svg{width:24px;height:24px;fill:#fff}
#ctrl .time{color:#fff;font-size:15px;margin:0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
#ctrl .ttl2{color:#C9D3EA;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctrl .sp{flex:1}
#ctrl #cSpd{width:auto;padding:0 12px;font-size:15px;font-weight:800}
#spdMenu{position:absolute;right:70px;bottom:62px;background:rgba(14,18,32,.97);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px;display:none;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#spdMenu.on{display:block}
#spdMenu div{padding:9px 14px;border-radius:8px;color:#fff;font-size:15px;cursor:pointer;display:flex;justify-content:space-between}
#spdMenu div:hover{background:rgba(255,255,255,.1)}
#spdMenu div.sel{color:#FF6B6B;font-weight:800}
#spdMenu .h{color:#9FB2DA;font-size:13px;cursor:default;padding:6px 14px}
#spdMenu .h:hover{background:none}
#hud{display:none}
body.mouse #hud{opacity:1}
#hud button{background:rgba(20,28,48,.85);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer;font-family:inherit}
#hud .pos{color:#cbd5e1;font-size:13px;margin-right:4px;background:rgba(20,28,48,.85);padding:7px 10px;border-radius:10px}
#tip{position:absolute;left:58px;bottom:110px;z-index:5;font-size:15px;color:#7E90B8;opacity:0;transition:opacity .4s}
#tip.on{opacity:.9}

<script>
/* =========================================================
   재생 엔진 (대사 단위 진행, 음성, 효과음, 메뉴)
   - 음성: audio/<대사ID>.mp3 또는 .wav가 있으면 사용, 없으면 브라우저 한국어 음성(임시)
   ========================================================= */
const SPK = { N:{name:'내레이션', pitch:1.0, rate:1.05} };
const stage=document.getElementById('stage'), scene=document.getElementById('scene'), cap=document.getElementById('cap'), endov=document.getElementById('endov'), menu=document.getElementById('menu');
let S={}, INSTANT=false, RUN=null, CUR={ci:-1,si:0}, paused=false, playAll=false, CURA=null;
const CLIPS=[];
window.ENGINE={ instant:()=>INSTANT, paused:()=>paused };

function fit(){ const s=Math.min(innerWidth/1600, innerHeight/900); stage.style.transform=`scale(${s})`; }
addEventListener('resize', fit); fit();

const $=s=>stage.querySelector(s);
const $$=s=>[...stage.querySelectorAll(s)];
function add(html){ scene.insertAdjacentHTML('beforeend', html); }
function on(sel, v=true){ $$(sel).forEach(e=>e.classList.toggle('on', v)); }
function only(group, sel){ $$(group).forEach(e=>e.classList.remove('on')); if(sel) on(sel); }
function later(fn, ms){ if(INSTANT) return fn(); const tk=RUN; setTimeout(()=>{ if(RUN===tk) fn(); }, ms); }
function seq(fns, gap){ fns.forEach((f,i)=>later(f, i*gap)); }
function hdr(k,t,id='hd'){ return `<div class="hdr fade on" id="${id}"><div class="kicker">${k}</div><div class="ttl">${t}</div></div>`; }
function tip(v){ document.getElementById('tip').classList.toggle('on', v); }

/* ---------- 효과음 (Web Audio) ---------- */
let AC=null, MASTER=null;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=0.8; MASTER.connect(AC.destination);} if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f,t0,dur,type='sine',vol=.2,f2){ const c=ac(), o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g).connect(MASTER); o.start(t0); o.stop(t0+dur+0.05); }
function noise(t0,dur,f1,f2,vol=.25){ const c=ac(), n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; const src=c.createBufferSource(); src.buffer=buf; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(f1,t0); bp.frequency.exponentialRampToValueAtTime(f2,t0+dur); const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+dur*0.4); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); src.connect(bp).connect(g).connect(MASTER); src.start(t0); src.stop(t0+dur+0.02); }
const SFX={
  ding(){ const t=ac().currentTime; tone(1046.5,t,.7,'sine',.2); tone(1568,t+.07,.8,'sine',.12); },
  pop(){ const t=ac().currentTime; tone(520,t,.12,'sine',.14,1040); },
  whoosh(){ noise(ac().currentTime,.5,300,2600,.2); },
  glow(){ const t=ac().currentTime; tone(392,t,.9,'sine',.07,784); tone(587,t+.05,.9,'sine',.05,1174); },
  zap(){ const t=ac().currentTime; tone(880,t,.08,'square',.05,1760); tone(1320,t+.06,.1,'square',.04,2400); },
  bad(){ const t=ac().currentTime; tone(220,t,.25,'sawtooth',.07,150); tone(180,t+.12,.3,'sawtooth',.06,120); },
  cut(){ const t=ac().currentTime; noise(t,.18,2500,6000,.25); tone(300,t+.05,.25,'triangle',.1,120); },
  ok(){ const t=ac().currentTime; tone(784,t,.3,'sine',.18); tone(1046.5,t+.16,.55,'sine',.18); },
  tick(){ const t=ac().currentTime; tone(1500,t,.04,'square',.03); },
  levelup(){ const t=ac().currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.09,.32,'triangle',.12)); },
};
function sfx(name){ if(INSTANT||!name) return; try{ SFX[name]&&SFX[name](); }catch(e){} }

/* ---------- 음성 ---------- */
let KO=null;
function pickVoice(){ const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('ko')); KO=v.find(x=>/natural|online/i.test(x.name))||v[0]||null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function plain(t){ return t.replace(/<[^>]+>/g,''); }
function stopAudio(){ if(CURA&&CURA.a){ CURA.a.onended=null; CURA.a.onerror=null; try{CURA.a.pause();}catch(e){} } CURA=null; if(window.speechSynthesis) speechSynthesis.cancel(); }
/* 확인 문제(문제·해설) 대사는 음성 없이 자막만 보여 줌 */
const SILENT=id=>/(^|_)q[^-]*-[qa]$/.test(id||'');
function speak(step){
  return new Promise(resolve=>{
    let fin=false; const done=()=>{ if(fin) return; fin=true; resolve(); };
    if(SILENT(step.id)){ const tk=RUN; CURA={tts:true, done}; waitMs(Math.max(3000, plain(step.say||step.t).length*150), tk).then(done); return; }
    const exts=['mp3','wav']; let k=0;
    const tts=()=>{
      const txt=step.say||plain(step.t);
      const est=Math.max(2500, txt.length*200)+4000;
      if(!window.speechSynthesis||!KO){ const tk=RUN; waitMs(Math.max(2200, txt.length*165), tk).then(done); return; }
      const u=new SpeechSynthesisUtterance(txt); u.lang='ko-KR'; u.voice=KO; u.rate=SPK.N.rate*SPEED; u.pitch=SPK.N.pitch; u.volume=MUTED?0:1;
      const t0=performance.now(), minD=(txt.length*120+500)/SPEED;
      const fin2=()=>{ const el=performance.now()-t0; if(el<minD*0.5) setTimeout(done, minD-el); else done(); };
      u.onend=fin2; u.onerror=fin2; CURA={tts:true, done};
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      setTimeout(done, est);
    };

const ZOOM_EL=()=>['#gl','#labels','#scene'].map(s=>document.querySelector(s));

    if(!off) e.style.transformOrigin=`${x}px ${y}px`; e.style.transform=off?'':`scale(${s})`; });

  requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('instant')));

    if(RUN!==tk) return;
